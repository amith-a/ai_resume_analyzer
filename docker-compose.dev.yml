services:
  node-api:
    image: ai-resume-analyzer:dev
    build:
      context: .
      target: development
    environment:
      - NODE_ENV=development
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
            - dist/
            - .git/
        - action: sync
          path: ./tests
          target: /app/tests
          ignore:
            - node_modules/
            - dist/
            - .git/
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  postgres:
    volumes:
      - postgres_dev_data:/var/lib/postgresql

volumes:
  postgres_dev_data:
